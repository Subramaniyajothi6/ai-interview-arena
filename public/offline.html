<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · AI Interview Arena</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #f7f6f3;
        color: #1c1b22;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e4e1da;
        border-radius: 14px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(23, 21, 42, 0.06);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #fff7e6;
        color: #b45309;
        display: grid;
        place-items: center;
      }
      h1 {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #5f5c68;
        font-size: 14px;
        line-height: 1.55;
        margin: 0 0 20px;
      }
      button {
        height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        border: 1px solid #6d28d9;
        background: #6d28d9;
        color: #fff;
        font:
          600 14px system-ui,
          sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: #5b21b6;
      }
      .brand {
        margin-top: 20px;
        font-size: 12px;
        color: #8b88a3;
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="icon" aria-hidden="true">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3l10 18H2z" />
          <path d="M12 10v5M12 18h.01" />
        </svg>
      </div>
      <h1>No internet connection</h1>
      <p>
        You're offline, so this page couldn't load. Check your Wi-Fi or mobile data. The page will
        reload by itself when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="brand">AI Interview Arena</div>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
